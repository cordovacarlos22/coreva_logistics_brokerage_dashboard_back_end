services:
  - type: web
    name: coreva-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://dashboard.corevalogisticsbrokerage.com
      # Set these two in the Render dashboard during setup (Project Settings
      # -> API in Supabase). Use the SECRET key (sb_secret_... / legacy
      # service_role JWT), not the publishable/anon one -- this client
      # bypasses RLS.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Paste the full contents of a Google Cloud service-account JSON key
      # here (Vision API OCR, /api/ocr/bol) -- the whole file as one string,
      # not a path. Render has no persistent disk for a file-path var to
      # point at.
      - key: GOOGLE_CLOUD_CREDENTIALS_JSON
        sync: false

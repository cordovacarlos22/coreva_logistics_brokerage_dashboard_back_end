services:
  - type: web
    name: coreva-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://dashboard.corevalogisticsbrokerage.com
      # Set these two in the Render dashboard during setup (Project Settings
      # -> API in Supabase). Use the SECRET key (sb_secret_... / legacy
      # service_role JWT), not the publishable/anon one -- this client
      # bypasses RLS.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # IAM user/role credentials for Amazon Textract OCR (/api/ocr/bol).
      # The IAM policy only needs textract:AnalyzeDocument.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
